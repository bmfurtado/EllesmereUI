name: Fork release (upstream tag + feat branches)

# Watches upstream (EllesmereGaming/EllesmereUI) for new release tags and, for
# each one, publishes a release on this fork built from the upstream tag plus
# every origin feat/* branch merged on top. A branch ships if and only if it
# is named feat/*; delete a branch (e.g. after its upstream PR merges) and it
# drops out of the next release automatically.
#
# Every run works out what the release *should* contain — the latest upstream
# tag plus the current tip of every feat/* branch that upstream does not have
# yet — and compares that with what the latest -bmf.N release for that tag was
# built from (recorded in the tag message). A new upstream tag, a feat branch
# created, pushed to, rebased or deleted: each changes the composition, and
# the next run cuts -bmf.N+1. Nothing changed: the run is a no-op. So the
# schedule is the only trigger that matters; it runs hourly because upstream
# often tags several times a day and GitHub starts cron runs hours late.
#
# Two event triggers shorten the wait where GitHub lets us: deleting a feat/*
# branch runs the same check right away, and fork-branch-sanitize.yml
# dispatches it after cleaning a feat/* branch cut from fork main. (A create
# or push event cannot trigger this workflow for a branch cut from upstream:
# those only fire for workflow files present on the pushed ref.) Manual
# dispatch with force enabled cuts -bmf.N+1 even when nothing changed.
#
# On a merge conflict, the conflict-issue job opens an issue so a human can
# rebase the conflicting branch onto the upstream tag; the next run retries.

on:
  schedule:
    - cron: '17 * * * *'
  delete:
  workflow_dispatch:
    inputs:
      force:
        description: Release again for the current upstream tag even if nothing changed (bumps -bmf.N)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/EllesmereGaming/EllesmereUI.git

jobs:
  release:
    # The delete trigger fires for every ref; only feat/* branch deletions
    # change what a release contains.
    if: github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'feat/'))
    runs-on: ubuntu-latest
    outputs:
      conflict: ${{ steps.build.outputs.conflict }}
      conflict_branch: ${{ steps.build.outputs.conflict_branch }}
      upstream_tag: ${{ steps.build.outputs.upstream_tag }}
      fork_tag: ${{ steps.build.outputs.fork_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushing the fork tag also pushes upstream's commits into the fork,
          # and those may touch .github/workflows/*. GITHUB_TOKEN (an App token)
          # can never push workflow changes, so use a PAT with workflows scope.
          token: ${{ secrets.FORK_RELEASE_TOKEN }}

      # Because the tag is pushed with a PAT (user token), the push triggers
      # workflows — GITHUB_TOKEN pushes wouldn't. That fires upstream's
      # tag-triggered release.yml on the fork, whose duplicate packager run
      # fails (it re-updates the already-published release and trips the
      # release-body size cap). It is fully redundant here — this workflow
      # packages and publishes — so keep it disabled. Idempotent: re-disables
      # it on every run in case it ever gets re-enabled.
      - name: Keep upstream's tag-triggered packager disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/disable" \
            || echo "::warning::Could not disable release.yml (missing or renamed upstream?)"

      - name: Merge feat branches onto latest upstream tag
        id: build
        env:
          FORCE: ${{ inputs.force == true }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream --tags

          upstream_tag=$(git ls-remote --tags --refs upstream 'v*' \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+(\.[0-9]+)*$' \
            | sort -V | tail -n 1)
          if [ -z "$upstream_tag" ]; then
            echo "::error::Could not determine the latest upstream release tag"
            exit 1
          fi
          echo "Latest upstream release: $upstream_tag"

          # A feat branch whose commits upstream already has (its PR merged)
          # adds nothing; leave it out so it can't keep forcing new releases.
          nl=$'\n'
          feat_branches=""
          for branch in $(git branch -r --list 'origin/feat/*' --format='%(refname:short)'); do
            if git merge-base --is-ancestor "$branch" "$upstream_tag"; then
              echo "$branch is already part of $upstream_tag; skipping it (delete the branch once its upstream PR has shipped)"
            else
              feat_branches="${feat_branches:+$feat_branches$nl}$branch"
            fi
          done
          if [ -z "$feat_branches" ]; then
            echo "No feat/ branches with changes on top of $upstream_tag; nothing to release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # What this release would be built from, one "branch@sha" per line.
          # The same list is written into the fork tag's message, so a later
          # run can tell whether anything has changed since.
          composition=$(for branch in $feat_branches; do
            echo "${branch#origin/}@$(git rev-parse "$branch")"
          done)

          last_tag=$(git tag --list "${upstream_tag}-bmf.*" | sort -V | tail -n 1)
          if [ -n "$last_tag" ] && [ "$FORCE" != "true" ]; then
            recorded=$(git for-each-ref "refs/tags/$last_tag" --format='%(contents:body)' \
              | grep -E '^feat/.+@[0-9a-f]{40}$' || true)
            if [ -n "$recorded" ]; then
              if [ "$recorded" = "$composition" ]; then
                echo "$last_tag was built from exactly these feat/ branches; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "feat/ branches changed since $last_tag:"
              diff <(echo "$recorded") <(echo "$composition") || true
            else
              # Tag made before the composition was recorded: all we can
              # check is whether every branch tip is already in it.
              stale=""
              for branch in $feat_branches; do
                if ! git merge-base --is-ancestor "$branch" "$last_tag"; then
                  echo "$branch has commits that $last_tag does not include"
                  stale=true
                fi
              done
              if [ -z "$stale" ]; then
                echo "$last_tag already includes every feat/ branch; nothing to do."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          last_n=${last_tag##*-bmf.}
          fork_tag="${upstream_tag}-bmf.$(( ${last_n:-0} + 1 ))"

          git checkout --detach "$upstream_tag"

          for branch in $feat_branches; do
            echo "Merging $branch"
            if ! git merge --no-ff --no-edit "$branch"; then
              git merge --abort || true
              echo "::warning::Merge conflict merging $branch onto $upstream_tag; filing an issue"
              {
                echo "conflict=true"
                echo "conflict_branch=${branch#origin/}"
                echo "upstream_tag=$upstream_tag"
                echo "fork_tag=$fork_tag"
                echo "proceed=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          summary="$upstream_tag + $(echo "$feat_branches" | sed 's|^origin/||' | paste -sd ', ' -)"
          git tag -a "$fork_tag" -m "$summary" -m "$composition"
          git push origin "$fork_tag"
          echo "Tagged and pushed $fork_tag"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Package and publish GitHub release
        if: steps.build.outputs.proceed == 'true'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

  conflict-issue:
    needs: release
    if: needs.release.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ needs.release.outputs.conflict_branch }}
      UPSTREAM_TAG: ${{ needs.release.outputs.upstream_tag }}
      FORK_TAG: ${{ needs.release.outputs.fork_tag }}
    steps:
      - name: Open issue for the merge conflict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          title="Fork release: merge conflict building $FORK_TAG"
          {
            echo "Merging \`$BRANCH\` onto \`$UPSTREAM_TAG\` failed with conflicts."
            echo
            echo "Resolve by rebasing the branch onto the tag; the next scheduled run picks it up."
            echo
            echo "Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue-body.md

          # REST, not gh issue list/create: those use GraphQL, which rejects
          # this workflow's token ("Resource not accessible by integration")
          # even with issues: write granted. The REST issues API accepts it.
          existing_issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$existing_issue" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@/tmp/issue-body.md
          fi
          echo "::error::Merge conflict on $BRANCH; issue filed"
          exit 1
